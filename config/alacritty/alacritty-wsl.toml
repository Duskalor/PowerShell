# Alacritty config dedicated to WSL — opens directly into the WSL default distro.
# Default `alacritty.toml` is left untouched and behaves as before.
# Launch this profile with: alacritty.exe --config-file <path-to-this-file>

[font]
size = 14

[font.normal]
family = "IosevkaTerm NFM"
style  = "Regular"

[font.bold]
family = "IosevkaTerm NFM"
style  = "Bold"

[font.italic]
family = "IosevkaTerm NFM"
style  = "Italic"

[font.bold_italic]
family = "IosevkaTerm NFM"
style  = "Bold Italic"

[window]
opacity = 1.0
decorations = "Full"
startup_mode = "Windowed"
dynamic_title = false

[general]
live_config_reload = false

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[terminal.shell]
program = "C:\\Windows\\System32\\wsl.exe"
# `~` makes wsl land in /home/paul (Linux home), not /mnt/c/...
# zsh is the user's default shell, and the .zshrc auto-launches Zellij — no extra args needed.
args = ["--cd", "~"]

# ──────────────────────────────────────────────────────────────────────────────
# Catppuccin Mocha — official palette
# ──────────────────────────────────────────────────────────────────────────────

